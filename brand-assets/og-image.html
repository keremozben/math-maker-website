<!doctype html>
<!-- Source of /og-image.png (1200×630). Re-render: node brand-assets/capture.mjs -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Exo";
        font-weight: 800;
        src: url("../fonts/exo-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Exo";
        font-weight: 600;
        src: url("../fonts/exo-latin-600-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Exo", sans-serif;
        color: #fff;
        background: #151f2b;
      }
      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        padding: 0 80px;
        gap: 56px;
        background-image:
          repeating-linear-gradient(45deg, rgba(128, 208, 255, 0.07) 0 2px, transparent 2px 90px),
          repeating-linear-gradient(-45deg, rgba(128, 208, 255, 0.07) 0 2px, transparent 2px 90px),
          radial-gradient(ellipse at 80% 50%, rgba(79, 168, 255, 0.18), transparent 60%);
      }
      .left {
        flex: 1;
        min-width: 0;
      }
      .eyebrow {
        display: inline-block;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #ff6d00;
        background: rgba(255, 109, 0, 0.16);
        padding: 8px 20px;
        border-radius: 999px;
        margin-bottom: 26px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-bottom: 26px;
      }
      .brand img {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      h1 {
        font-size: 92px;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(120deg, #ffffff 35%, #80d0ff);
        -webkit-background-clip: text;
        color: transparent;
      }
      .stats {
        font-size: 30px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.78);
      }
      .stats b {
        color: #ff6d00;
        font-weight: 800;
      }
      .card {
        flex-shrink: 0;
        width: 340px;
        background: #1c2839;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 34px 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .timer {
        width: 110px;
        height: 110px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: conic-gradient(#2bd589 72%, rgba(255, 255, 255, 0.1) 0);
        display: grid;
        place-items: center;
      }
      .timer span {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #1c2839;
        display: grid;
        place-items: center;
        font-size: 40px;
        font-weight: 800;
      }
      .q {
        text-align: center;
        font-size: 58px;
        font-weight: 800;
        white-space: nowrap;
        margin-bottom: 24px;
      }
      .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .answers div {
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        padding: 14px 0;
        border-radius: 16px;
        background: #243349;
      }
      .answers .ok {
        background: #2bd589;
        color: #062b1a;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="left">
        <span class="eyebrow">MIND CHALLENGE</span>
        <div class="brand">
          <img src="app-icon-256.png" alt="" />
          <h1>MathMaker</h1>
        </div>
        <p class="stats"><b>7</b> categories · <b>2,300</b> levels · <b>69,000</b> questions</p>
      </div>
      <div class="card">
        <div class="timer"><span>14</span></div>
        <div class="q">7 × 8 = ?</div>
        <div class="answers">
          <div>54</div>
          <div class="ok">56</div>
          <div>48</div>
          <div>64</div>
        </div>
      </div>
    </div>
  </body>
</html>
